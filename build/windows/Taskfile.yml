version: '3'

includes:
  common: ../Taskfile.yml

vars:
  # 从 version.json 自动提取版本号，注入到 Go 编译中
  VERSION:
    sh: powershell -NoProfile -ExecutionPolicy Bypass -File build/get_version.ps1

tasks:
  build:
    summary: Build the application for Windows (release, stripped)
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
    cmds:
      - go build -tags production -ldflags="-w -s -H windowsgui -X cczjVideo/app/updater.Version={{.VERSION}}" -o ./bin/cczjVideo.exe

  build:dev:
    summary: Build the application for Windows (development, with console + logs)
    deps:
      - task: common:go:mod:tidy
    cmds:
      - go build -ldflags="-X cczjVideo/app/updater.Version={{.VERSION}}" -o ./bin/cczjVideo.exe

  build:prod:
    summary: Build the application for Windows (production)
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
    cmds:
      - go build -tags production -ldflags="-w -s -H windowsgui -X cczjVideo/app/updater.Version={{.VERSION}}" -o ./bin/cczjVideo.exe

  run:
    summary: Runs the application
    cmds:
      - ./bin/cczjVideo.exe
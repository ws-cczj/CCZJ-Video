<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
    <title>CCZJ Video</title>
    <link rel="icon" href="data:," />
    <style>
      html,body { background:var(--cczj-boot-bg,#faf9f6); }
      .initial-boot { position:fixed; inset:0; background:var(--cczj-boot-bg,#faf9f6); }
    </style>
    <script>
      try { var bootColor=localStorage.getItem('cczj.boot.background.v1'); if(/^#[\da-f]{6}$/i.test(bootColor||'')) document.documentElement.style.setProperty('--cczj-boot-bg',bootColor); } catch (_) {}
    </script>
</head>
<body>
<div id="app"><div class="initial-boot" role="status" aria-label="CCZJ Video"></div></div>
<script src="./src/main.ts" type="module"></script>
</body>
</html>
